<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Dark Studio Backdrop -->
    <radialGradient id="studioDark" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#141a29" />
      <stop offset="60%" stop-color="#080b12" />
      <stop offset="100%" stop-color="#020306" />
    </radialGradient>

    <!-- Horizontal Anamorphic Laser Streak -->
    <linearGradient id="beamCoreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="10%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="85%" stop-color="#60a5fa" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="beamFlare" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="20%" stop-color="#93c5fd" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Magazine Cover Drop Shadow -->
    <filter id="coverShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.95" />
    </filter>

    <!-- Paparazzi Flash Burst -->
    <radialGradient id="paparazziBurst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#e0f2fe" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#studioDark)" />

  <!-- Magazine Cover Group (Tilted 3D Aesthetic) -->
  <g transform="translate(400, 225) rotate(-3) scale(0.96)" filter="url(#coverShadow)">
    <!-- Magazine Slate Surface -->
    <rect x="-190" y="-210" width="380" height="420" rx="4" fill="#090d16" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

    <!-- Subtle Vignette Inside Magazine -->
    <rect x="-190" y="-210" width="380" height="420" rx="4" fill="radial-gradient(circle at 50% 40%, rgba(30,41,59,0.3) 0%, rgba(2,6,23,0.9) 100%)" />

    <!-- Top Red Kicker Box -->
    <rect x="-42" y="-198" width="84" height="15" rx="2" fill="#ef4444" />
    <text x="0" y="-187" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="900" font-size="7.5" letter-spacing="1" text-anchor="middle">SPECIAL ISSUE</text>

    <!-- Top Headline Tickers -->
    <text x="-175" y="-188" fill="rgba(255,255,255,0.4)" font-family="'Inter', sans-serif" font-size="5.5" font-weight="700">THE VATICAN'S CORRUPTION</text>
    <text x="75" y="-188" fill="rgba(255,255,255,0.4)" font-family="'Inter', sans-serif" font-size="5.5" font-weight="700">THE MOGUL WHO MASTERED</text>

    <!-- Silhouette / Portrait Placeholder (NOT SBF) -->
    <g transform="translate(0, 15)">
      <!-- Head and Shoulders Silhouette with Rim Lighting -->
      <path d="M-65,175 C-60,95 -45,70 -30,65 C-25,40 -20,20 -15,10 C-10,0 -5,-15 0,-15 C5,-15 10,0 15,10 C20,20 25,40 30,65 C45,70 60,95 65,175 Z" fill="#111827" stroke="rgba(96,165,250,0.3)" stroke-width="1" />
      <!-- Rim light highlights -->
      <path d="M-15,10 C-10,0 -5,-15 0,-15 C5,-15 10,0 15,10" fill="none" stroke="#93c5fd" stroke-width="2" opacity="0.8" />
    </g>

    <!-- Forbes Logo Ghosted Depth-of-Field Layer -->
    <text x="0" y="-120" fill="rgba(255,255,255,0.22)" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="76" letter-spacing="-1.5" text-anchor="middle" filter="blur(6px)">Forbes</text>
    
    <!-- Main Forbes Masthead Logo -->
    <text x="0" y="-124" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="74" letter-spacing="-1.5" text-anchor="middle">Forbes</text>

    <!-- Feature Headlines: 40th ANNUAL FORBES 400 -->
    <g transform="translate(-170, 115)">
      <text x="0" y="0" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-weight="700" font-size="14" letter-spacing="1">40th ANNUAL</text>
      <text x="0" y="32" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="34" letter-spacing="-0.5">FORBES 400</text>
      <text x="0" y="48" fill="#94a3b8" font-family="'Inter', sans-serif" font-weight="600" font-size="6.5" letter-spacing="0.5">• NEW RECORD: $4.5 TRILLION FOR AMERICA'S RICHEST</text>
      <text x="0" y="58" fill="#94a3b8" font-family="'Inter', sans-serif" font-weight="600" font-size="6.5" letter-spacing="0.5">• CAN ANYONE REALLY TRUST THE NEW BILLIONAIRES?</text>
    </g>

    <!-- Right Side Subject Details -->
    <g transform="translate(90, 80)">
      <text x="0" y="0" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="900" font-size="8" letter-spacing="1.5">ALEXANDER VANCE</text>
      <text x="0" y="14" fill="#cbd5e1" font-family="'Georgia', serif" font-style="italic" font-size="7.5" width="85">"I BUILT AN EMPIRE</text>
      <text x="0" y="24" fill="#cbd5e1" font-family="'Georgia', serif" font-style="italic" font-size="7.5">BEFORE ANYONE</text>
      <text x="0" y="34" fill="#cbd5e1" font-family="'Georgia', serif" font-style="italic" font-size="7.5">KNEW WHAT WAS REAL."</text>
    </g>
  </g>

  <!-- Flash Burst Highlight Spikes -->
  <circle cx="280" cy="180" r="140" fill="url(#paparazziBurst)" opacity="0.6" />
  <circle cx="520" cy="200" r="90" fill="url(#paparazziBurst)" opacity="0.4" />

  <!-- The Iconic Anamorphic CRT Light Beam (Image 3) -->
  <g transform="translate(0, 220)">
    <!-- Broad Soft Anamorphic Glow -->
    <rect x="0" y="-24" width="800" height="48" fill="url(#beamCoreGrad)" opacity="0.35" filter="blur(8px)" />
    <!-- Mid Glow Line -->
    <rect x="0" y="-8" width="800" height="16" fill="url(#beamCoreGrad)" opacity="0.75" filter="blur(2px)" />
    <!-- Razor Sharp White Core Line -->
    <rect x="0" y="-1.5" width="800" height="3" fill="url(#beamCoreGrad)" />
    <!-- Anamorphic Lens Flare Burst (Left-Center) -->
    <ellipse cx="230" cy="0" rx="90" ry="20" fill="url(#beamFlare)" />
    <ellipse cx="230" cy="0" rx="30" ry="6" fill="#ffffff" />
  </g>

  <!-- Retro / CRT Scanline Texture -->
  <line x1="0" y1="216" x2="800" y2="216" stroke="rgba(255,255,255,0.2)" stroke-width="0.5" />
  <line x1="0" y1="224" x2="800" y2="224" stroke="rgba(255,255,255,0.2)" stroke-width="0.5" />

  <!-- Bottom Tag Pill -->
  <g transform="translate(400, 420)">
    <rect x="-110" y="-14" width="220" height="24" rx="12" fill="rgba(0,0,0,0.85)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="0" y="2" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1.5" text-anchor="middle">JANI 3D FORBES FLASH FX</text>
  </g>
</svg>
