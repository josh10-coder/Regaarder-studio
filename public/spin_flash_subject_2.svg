<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="noirCyanBg" cx="52%" cy="44%" r="72%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="48%" stop-color="#041322"/>
      <stop offset="100%" stop-color="#010409"/>
    </radialGradient>
    <radialGradient id="cyanKeyGlow" cx="62%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.48"/>
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="deepShadowVignette" cx="50%" cy="46%" r="62%">
      <stop offset="45%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.86"/>
    </radialGradient>
    <!-- Moody Neo-Noir Cyan/Blue Color Grade matching documentary reveal -->
    <filter id="cyanNoirGrade">
      <feColorMatrix type="matrix" values="
        0.22 0.35 0.15 0 -0.04
        0.18 0.72 0.35 0  0.01
        0.25 0.88 0.95 0  0.06
        0    0    0    1  0"/>
    </filter>
  </defs>

  <!-- Deep Neo-Noir Background -->
  <rect width="1280" height="720" fill="url(#noirCyanBg)"/>

  <!-- Subject 2: Distinct Portrait with Moody Cyan/Blue Key Lighting -->
  <image href="/ai_creator_portrait_cutout.png" x="140" y="-70" width="1000" height="860" preserveAspectRatio="xMidYMid slice" filter="url(#cyanNoirGrade)"/>

  <!-- Sleek Rimless Glasses Cyan Specular Highlight Overlay -->
  <g opacity="0.42" stroke="#7dd3fc" fill="none">
    <rect x="502" y="242" width="106" height="58" rx="14" stroke-width="2.2" fill="#38bdf8" fill-opacity="0.08"/>
    <rect x="648" y="240" width="106" height="58" rx="14" stroke-width="2.2" fill="#38bdf8" fill-opacity="0.08"/>
    <path d="M 608 266 Q 628 258 648 266" stroke-width="2.4" stroke="#bae6fd"/>
    <line x1="518" y1="250" x2="555" y2="290" stroke="#e0f2fe" stroke-width="3" stroke-opacity="0.45"/>
    <line x1="666" y1="248" x2="704" y2="288" stroke="#e0f2fe" stroke-width="3" stroke-opacity="0.45"/>
  </g>

  <!-- Directional Cyan Key Light Wash -->
  <rect width="1280" height="720" fill="url(#cyanKeyGlow)" style="mix-blend-mode: screen;"/>

  <!-- Deep Shadow Framing Vignette -->
  <rect width="1280" height="720" fill="url(#deepShadowVignette)"/>
</svg>
