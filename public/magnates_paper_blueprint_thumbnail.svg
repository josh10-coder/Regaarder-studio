<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#071b38"/>
      <stop offset="100%" stop-color="#020b18"/>
    </linearGradient>
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f0ff" stroke-width="0.7" stroke-opacity="0.25"/>
      <path d="M 150 0 L 0 0 0 150" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.4"/>
    </pattern>
    <filter id="paper-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="8" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00f0ff" flood-opacity="0.3"/>
    </filter>
    <filter id="hand-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="14" dy="22" stdDeviation="14" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Blueprint Background -->
  <rect width="800" height="450" fill="url(#bp-bg)"/>
  <rect width="800" height="450" fill="url(#grid-pattern)"/>

  <!-- Blueprint Technical Schematics & Annotation Lines -->
  <g stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="6,4">
    <circle cx="280" cy="225" r="140" fill="none"/>
    <circle cx="280" cy="225" r="170" fill="none" stroke-opacity="0.2"/>
    <line x1="80" y1="225" x2="480" y2="225"/>
    <line x1="280" y1="40" x2="280" y2="410"/>
    <line x1="160" y1="105" x2="400" y2="345"/>
  </g>

  <!-- Blueprint Technical Measurements -->
  <text x="50" y="45" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#38bdf8" letter-spacing="2">ARCHITECTURAL SCHEMATIC // SEC-08-BP</text>
  <text x="50" y="65" font-family="'Courier New', monospace" font-size="10" fill="#7dd3fc" opacity="0.7">SCALE 1:50  •  PAPER TEXTURE OVERLAY  •  ALPHA 84%</text>

  <!-- Paper Document Blueprint Cutout (Torn Border) -->
  <g transform="translate(140, 75) rotate(-4)" filter="url(#paper-shadow)">
    <!-- Ripped Paper Body -->
    <path d="M 0 0 L 260 5 L 265 240 L 5 245 Z" fill="#0f2b48" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 10 10 L 250 15 L 245 230 L 15 235 Z" fill="#081c33"/>
    
    <!-- Blueprint Internal Lines inside Paper -->
    <line x1="30" y1="40" x2="230" y2="40" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect x="30" y="55" width="190" height="110" fill="#0c233f" stroke="#00f0ff" stroke-width="1" stroke-dasharray="3,3"/>
    
    <!-- Architectural Compass / Sector Indicator -->
    <circle cx="125" cy="110" r="35" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="125" y1="75" x2="125" y2="145" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="90" y1="110" x2="160" y2="110" stroke="#f59e0b" stroke-width="1.5"/>

    <text x="35" y="190" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#ffffff">FIG. 4A: FINANCIAL DOSSIER</text>
    <text x="35" y="210" font-family="'Courier New', monospace" font-size="9" fill="#93c5fd">CONFIDENTIAL DISCLOSURE // 1984</text>
  </g>

  <!-- Floating 2D Portrait Paper Cutout (White Stroke Sticker Border) -->
  <g transform="translate(340, 100) rotate(6)" filter="url(#paper-shadow)">
    <!-- White Paper Sticker Rim -->
    <rect x="-8" y="-8" width="206" height="236" rx="14" fill="#ffffff" opacity="0.95"/>
    <!-- Inner Card -->
    <rect x="0" y="0" width="190" height="220" rx="10" fill="#1e293b"/>
    <rect x="5" y="5" width="180" height="150" rx="6" fill="#0f172a"/>

    <!-- Abstract Cutout Silhouette / Subject Portrait -->
    <circle cx="95" cy="65" r="32" fill="#e2e8f0"/>
    <path d="M 50 145 C 50 105 140 105 140 145 Z" fill="#cbd5e1"/>
    <!-- Stamp Ribbon -->
    <rect x="25" y="168" width="140" height="22" rx="4" fill="#ef4444"/>
    <text x="95" y="183" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">ARCHIVAL EVIDENCE</text>
    <text x="95" y="206" font-family="monospace" font-size="8.5" font-weight="bold" fill="#94a3b8" text-anchor="middle">MAGNATES MEDIA CUTOUT</text>
  </g>

  <!-- Moving Hand Cutout Placing Evidence (Signature Magnates Motif) -->
  <g transform="translate(480, 210) rotate(-18)" filter="url(#hand-shadow)">
    <!-- Arm / Sleeve -->
    <path d="M 120 220 L 70 80 L 140 50 L 220 180 Z" fill="#1e293b" stroke="#ffffff" stroke-width="3"/>
    <!-- Shirt Cuff -->
    <path d="M 68 83 L 138 53 L 144 65 L 74 95 Z" fill="#f8fafc"/>
    <!-- Hand Palm & Pointing Fingers -->
    <path d="M 74 95 C 60 105 40 120 25 110 C 15 102 20 85 35 75 L 85 45 C 95 38 115 45 118 55 C 120 65 110 80 95 88 Z" fill="#fbcfe8" stroke="#ffffff" stroke-width="3"/>
    <path d="M 35 75 L -10 55 C -25 45 -20 30 -5 25 C 12 20 30 35 45 45 Z" fill="#fbcfe8" stroke="#ffffff" stroke-width="3"/>
    <!-- Pin Dropping onto Document -->
    <circle cx="-12" cy="50" r="7" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
    <line x1="-12" y1="57" x2="-18" y2="80" stroke="#cbd5e1" stroke-width="3"/>
  </g>

  <!-- Technical Corner Marks -->
  <path d="M 20 40 L 20 20 L 40 20" stroke="#00f0ff" stroke-width="3" fill="none"/>
  <path d="M 780 40 L 780 20 L 760 20" stroke="#00f0ff" stroke-width="3" fill="none"/>
  <path d="M 20 410 L 20 430 L 40 430" stroke="#00f0ff" stroke-width="3" fill="none"/>
  <path d="M 780 410 L 780 430 L 760 430" stroke="#00f0ff" stroke-width="3" fill="none"/>

  <!-- Badge Overlay -->
  <g transform="translate(560, 30)">
    <rect width="210" height="34" rx="8" fill="#0284c7" opacity="0.95"/>
    <text x="105" y="22" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">📐 PAPER &amp; BLUEPRINT</text>
  </g>
</svg>
