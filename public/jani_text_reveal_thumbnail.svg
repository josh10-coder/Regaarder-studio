<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="400" height="225">
  <defs>
    <!-- Background Code Matrix -->
    <linearGradient id="bgMatrix" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020805" />
      <stop offset="50%" stop-color="#05140d" />
      <stop offset="100%" stop-color="#010402" />
    </linearGradient>

    <!-- Matrix Emerald Glow -->
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="1" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="225" fill="url(#bgMatrix)" />

  <!-- Digital Grid Matrix Background Pattern -->
  <g opacity="0.18" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="7">
    <text x="20" y="30">01001000 01000101 01000001 01010110</text>
    <text x="20" y="50">01011001 00100000 01010110 01001001</text>
    <text x="20" y="70">01000111 01001110 01000101 01010100</text>
    <text x="20" y="175">7B 22 74 79 70 65 22 3A 20 22 64 65</text>
    <text x="20" y="195">63 6F 64 65 22 2C 20 22 6C 69 6E 65</text>
    <text x="20" y="215">73 22 3A 20 22 74 6F 67 65 74 68 65</text>
  </g>

  <!-- Central Frame -->
  <rect x="50" y="48" width="300" height="128" rx="10" fill="#030b07" fill-opacity="0.9" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Terminal Header Bar -->
  <rect x="50" y="48" width="300" height="22" rx="10" fill="#061f14" />
  <circle cx="65" cy="59" r="3" fill="#ef4444" />
  <circle cx="75" cy="59" r="3" fill="#f59e0b" />
  <circle cx="85" cy="59" r="3" fill="#10b981" />
  <text x="200" y="63" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#a7f3d0" letter-spacing="1.5" text-anchor="middle">
    CHARACTER_OFFSET_DECODE // GLYPH_CHAOS
  </text>

  <!-- Animated Decoded Title -->
  <text x="200" y="105" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="900" letter-spacing="2.5" fill="#34d399" text-anchor="middle">
    DECODE LINES TOGETHER
  </text>

  <!-- Scrambled Secondary Line with Terminal Block Cursor -->
  <text x="188" y="128" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" letter-spacing="1.5" fill="#6ee7b7" text-anchor="middle">
    CONFIDENTIAL_EVIDENCE_9X$!
  </text>
  <rect x="290" y="118" width="8" height="12" fill="#10b981" opacity="0.9" />

  <text x="200" y="152" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700" letter-spacing="1.5" fill="#059669" text-anchor="middle">
    TYPEWRITER CURSOR // JITTER OFFSET 65%
  </text>

  <!-- Tag Pill Left -->
  <rect x="14" y="14" width="144" height="20" rx="5" fill="#000000" fill-opacity="0.85" stroke="#10b981" stroke-width="1" />
  <circle cx="26" cy="24" r="3.5" fill="#10b981" />
  <text x="36" y="27.5" font-family="monospace" font-size="7.5" font-weight="800" fill="#a7f3d0" letter-spacing="1">TEXT DECODE FX</text>

  <!-- Tag Pill Right -->
  <rect x="306" y="14" width="80" height="20" rx="5" fill="#000000" fill-opacity="0.85" stroke="#10b981" stroke-width="1" />
  <text x="346" y="27.5" font-family="monospace" font-size="7.5" font-weight="800" fill="#34d399" text-anchor="middle">INSTANT FX</text>
</svg>
