<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="flashbackBgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2d1202"/>
      <stop offset="55%" stop-color="#140804"/>
      <stop offset="100%" stop-color="#050302"/>
    </radialGradient>

    <!-- White Flash Burst Filter -->
    <filter id="superGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="18" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Linear Gradient for Motion Streak -->
    <linearGradient id="motionStreak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(251, 191, 36, 0.8)"/>
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.95)"/>
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0.8)"/>
    </linearGradient>

    <linearGradient id="filmGrate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Dark Backdrop -->
  <rect width="400" height="225" fill="url(#flashbackBgGrad)"/>

  <!-- High-Contrast Archival Photo Silhouette (Grayscale / Vintage Sepia Memory) -->
  <g opacity="0.45" filter="contrast(1.6) brightness(0.9)">
    <rect x="30" y="25" width="340" height="175" rx="6" fill="#1c1917" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5"/>
    <circle cx="140" cy="95" r="45" fill="#44403c"/>
    <path d="M 60 190 Q 140 120 220 190 Z" fill="#292524"/>
    <rect x="230" y="65" width="120" height="15" rx="3" fill="#57534e"/>
    <rect x="230" y="90" width="95" height="10" rx="2" fill="#44403c"/>
    <rect x="230" y="110" width="110" height="10" rx="2" fill="#44403c"/>
    <rect x="230" y="130" width="80" height="10" rx="2" fill="#44403c"/>
  </g>

  <!-- 45-Degree Directional Motion Blur Light Streaks -->
  <g stroke="url(#motionStreak)" stroke-width="2.5" opacity="0.65">
    <line x1="0" y1="40" x2="220" y2="225"/>
    <line x1="80" y1="0" x2="340" y2="225"/>
    <line x1="180" y1="0" x2="400" y2="190"/>
    <line x1="0" y1="120" x2="120" y2="225"/>
  </g>

  <!-- Sudden High-Exposure White Flash Cut Lightburst -->
  <circle cx="200" cy="112" r="85" fill="#ffffff" opacity="0.35" filter="url(#superGlow)"/>
  <ellipse cx="200" cy="112" rx="160" ry="25" fill="#ffffff" opacity="0.45" transform="rotate(-30 200 112)" filter="url(#superGlow)"/>

  <!-- Top Badges -->
  <rect x="14" y="12" width="125" height="20" rx="6" fill="rgba(10, 10, 15, 0.85)" stroke="rgba(245, 158, 11, 0.5)" stroke-width="1"/>
  <circle cx="24" cy="22" r="3.5" fill="#f59e0b"/>
  <text x="34" y="25.5" fill="#fbbf24" font-family="'Share Tech Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="1">FLASHBACK // -10Y</text>

  <rect x="305" y="12" width="82" height="20" rx="6" fill="rgba(10, 10, 15, 0.85)" stroke="rgba(6, 182, 212, 0.5)" stroke-width="1"/>
  <text x="314" y="25.5" fill="#38bdf8" font-family="'Share Tech Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="1">FLASHFORWARD</text>

  <!-- Center Dramatic Kinetic Typography Plate -->
  <g filter="url(#superGlow)">
    <rect x="75" y="72" width="250" height="78" rx="8" fill="rgba(8, 9, 14, 0.88)" stroke="#ffffff" stroke-width="1.5"/>
  </g>
  <rect x="75" y="72" width="250" height="78" rx="8" fill="rgba(8, 9, 14, 0.92)" stroke="rgba(255,255,255,0.8)" stroke-width="1.2"/>

  <!-- Corner framing accents -->
  <line x1="75" y1="84" x2="75" y2="72" stroke="#fbbf24" stroke-width="3"/>
  <line x1="75" y1="72" x2="87" y2="72" stroke="#fbbf24" stroke-width="3"/>
  <line x1="325" y1="84" x2="325" y2="72" stroke="#fbbf24" stroke-width="3"/>
  <line x1="325" y1="72" x2="313" y2="72" stroke="#fbbf24" stroke-width="3"/>

  <!-- Subcaption Tagline -->
  <text x="200" y="93" fill="#c084fc" font-family="'Share Tech Mono', monospace" font-size="8" font-weight="800" letter-spacing="2" text-anchor="middle">
    FLASHBACK: 15 YEARS PRIOR
  </text>

  <!-- Headline Title -->
  <text x="200" y="120" fill="#ffffff" font-family="'Inter', sans-serif" font-size="16" font-weight="900" letter-spacing="2" text-anchor="middle">
    THE 2008 CRASH
  </text>

  <!-- Accent bar -->
  <rect x="120" y="130" width="160" height="2" fill="url(#filmGrate)"/>

  <!-- Bottom Timeline Cut Bar -->
  <rect x="0" y="198" width="400" height="27" fill="rgba(9, 10, 16, 0.95)"/>
  <line x1="0" y1="198" x2="400" y2="198" stroke="rgba(168, 85, 247, 0.6)" stroke-width="1.5"/>
  <text x="14" y="215" fill="#cbd5e1" font-family="'Share Tech Mono', monospace" font-size="8.5">
    TEMPORAL CUT: 00:01.40  •  45° MOTION BLUR  •  WHITE FLASH SPIKE: 350MS
  </text>
  <rect x="330" y="204" width="58" height="15" rx="3" fill="#7e22ce"/>
  <text x="338" y="215" fill="#ffffff" font-family="'Share Tech Mono', monospace" font-size="7.5" font-weight="700">TIME JUMP</text>
</svg>
