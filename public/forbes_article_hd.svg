<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="subtle-paper-grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.98  0 0 0 0 0.98  0 0 0 0 0.97  0 0 0 0.05 0" />
      <feComposite in2="SourceGraphic" in="gl" operator="over" />
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff" />
  <rect width="1920" height="1080" fill="#faf9f6" opacity="0.5" />

  <!-- Forbes Top Header UI Bar -->
  <g transform="translate(240, 110)">
    <!-- Audio player / author placeholder pill -->
    <rect x="0" y="0" width="1440" height="74" rx="37" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Audio wave / play icon -->
    <circle cx="42" cy="37" r="20" fill="#0f172a" />
    <polygon points="37,27 37,47 52,37" fill="#ffffff" />
    <rect x="80" y="26" width="580" height="10" rx="5" fill="#cbd5e1" />
    <rect x="80" y="43" width="320" height="8" rx="4" fill="#e2e8f0" />
    <circle cx="1390" cy="37" r="16" fill="#f1f5f9" />
    <rect x="1382" y="35" width="16" height="4" rx="2" fill="#94a3b8" />
  </g>

  <!-- Audio text info -->
  <text x="240" y="230" fill="#64748b" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="500">
    This voice experience is generated by AI. <tspan fill="#2563eb" font-weight="600">Learn more</tspan>
  </text>

  <!-- Main Article Body Paragraph (Target Highlight Sentences) -->
  <g transform="translate(240, 275)">
    <text font-family="'Georgia', 'Merriweather', serif" font-size="35.5" fill="#1e293b" font-weight="400" letter-spacing="-0.2">
      <tspan x="0" y="46">Unlike other rich nations, the U.S. has no national requirement</tspan>
      <tspan x="0" y="94">for paid medical, parental or family caregiving leave. But</tspan>
      <tspan x="0" y="142">Democratic run states have been rolling out their own mandates.</tspan>
    </text>
  </g>

  <!-- Divider line -->
  <line x1="240" y1="465" x2="1680" y2="465" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Second Section with authentic large Drop Cap 'T' -->
  <g transform="translate(240, 520)">
    <!-- Authentic Editorial Drop Cap 'T' -->
    <text x="0" y="128" font-family="'Georgia', 'Merriweather', serif" font-size="144" font-weight="700" fill="#0f172a">T</text>
    
    <text font-family="'Georgia', 'Merriweather', serif" font-size="24" fill="#334155" line-height="1.5">
      <tspan x="122" y="38" font-weight="700" fill="#0f172a">his past January</tspan>
      <tspan fill="#334155">, a new Minnesota law took effect entitling private sector</tspan>
      <tspan x="122" y="78">workers to take up to 12 weeks of leave for family or medical needs, with a</tspan>
      <tspan x="122" y="118">state-paid benefit of up to $1,423 a week, and a guarantee of reinstatement</tspan>
      <tspan x="0" y="164">once the leave is over. In response, Steve Gilbertson, the owner of Electramatic, a</tspan>
      <tspan x="0" y="206">custom electrical cable assembly manufacturer in northern Minneapolis, decided to hire</tspan>
      <tspan x="0" y="248">a dozen extra employees just to make sure both shifts at his plant would be fully staffed.</tspan>
      <tspan x="0" y="290">"Someone could come in today and ask for (time off starting) tomorrow," worries</tspan>
    </text>
  </g>
</svg>
