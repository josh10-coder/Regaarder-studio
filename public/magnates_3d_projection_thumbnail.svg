<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060c"/>
      <stop offset="50%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>

    <!-- 3D Spatial Grid Radial -->
    <radialGradient id="spatial-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Accent Linear -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Cyan Accent Linear -->
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow-deep" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <filter id="glow-gold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clipping mask for portrait cutout -->
    <clipPath id="portrait-clip">
      <rect x="290" y="85" width="220" height="270" rx="14" />
    </clipPath>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="800" height="450" fill="url(#bg-grad)"/>

  <!-- Radial 3D Spatial Glow -->
  <circle cx="400" cy="225" r="320" fill="url(#spatial-glow)"/>

  <!-- 3D Perspective Grid Floor & Ceiling Vectors -->
  <g stroke="rgba(59,130,246,0.18)" stroke-width="1.2">
    <!-- Floor vanishing lines from (400, 225) -->
    <line x1="400" y1="225" x2="0" y2="450"/>
    <line x1="400" y1="225" x2="150" y2="450"/>
    <line x1="400" y1="225" x2="300" y2="450"/>
    <line x1="400" y1="225" x2="500" y2="450"/>
    <line x1="400" y1="225" x2="650" y2="450"/>
    <line x1="400" y1="225" x2="800" y2="450"/>
    <!-- Transverse depth rings -->
    <ellipse cx="400" cy="380" rx="360" ry="60" fill="none" stroke="rgba(59,130,246,0.12)"/>
    <ellipse cx="400" cy="320" rx="260" ry="42" fill="none" stroke="rgba(59,130,246,0.18)"/>
    <ellipse cx="400" cy="270" rx="160" ry="26" fill="none" stroke="rgba(59,130,246,0.25)"/>
  </g>

  <!-- LAYER 1: Background Archival Plate (Z: -120px) -->
  <g transform="matrix(0.92 0.05 -0.04 0.92 70 40)" filter="url(#shadow-deep)" opacity="0.65">
    <rect x="110" y="80" width="320" height="180" rx="10" fill="#1c1917" stroke="rgba(245,158,11,0.4)" stroke-width="1.5"/>
    <line x1="130" y1="105" x2="300" y2="105" stroke="#f59e0b" stroke-width="2"/>
    <text x="130" y="125" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">ARCHIVAL PLATE // Z:-120px</text>
    <rect x="130" y="140" width="280" height="8" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="130" y="155" width="240" height="8" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="130" y="170" width="260" height="8" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="130" y="185" width="180" height="8" rx="2" fill="rgba(255,255,255,0.15)"/>
    <text x="130" y="230" fill="#94a3b8" font-family="Georgia, serif" font-size="12" font-style="italic">"The financial empire was built on projected illusions..."</text>
  </g>

  <!-- LAYER 2: 3D Camera Frustum Rays & 50mm Camera Gizmo -->
  <g stroke="#38bdf8" stroke-dasharray="4,4" opacity="0.75">
    <!-- Camera rays linking null object to layers -->
    <line x1="120" y1="360" x2="290" y2="220" stroke-width="1.5"/>
    <line x1="120" y1="360" x2="400" y2="225" stroke-width="1.5"/>
    <line x1="120" y1="360" x2="510" y2="220" stroke-width="1.5"/>
  </g>

  <!-- 50mm Camera Controller Badge / Null Object Gizmo (Left) -->
  <g transform="translate(60, 310)" filter="url(#shadow-deep)">
    <rect width="180" height="68" rx="8" fill="rgba(15,23,42,0.95)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="26" cy="34" r="14" fill="#0284c7" opacity="0.3"/>
    <circle cx="26" cy="34" r="7" fill="#38bdf8"/>
    <text x="50" y="28" fill="#e0f2fe" font-family="'Inter', sans-serif" font-size="11" font-weight="800">50mm CAMERA</text>
    <text x="50" y="44" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">NULL OBJECT LINKED</text>
    <text x="50" y="58" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">FOCAL LENGTH: 50mm</text>
  </g>

  <!-- LAYER 3: Midground 2D Cutout Portrait Layer (Z: 0px) -->
  <g filter="url(#shadow-deep)">
    <!-- Cutout Frame Border -->
    <rect x="286" y="81" width="228" height="278" rx="16" fill="none" stroke="#3b82f6" stroke-width="2.5" opacity="0.8"/>
    
    <!-- Cutout Image Silhouette & Portrait Representation -->
    <g clip-path="url(#portrait-clip)">
      <rect x="290" y="85" width="220" height="270" fill="#0f172a"/>
      <!-- Gradient silhouette representation of cutout portrait -->
      <radialGradient id="portrait-grad" cx="50%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#60a5fa"/>
        <stop offset="40%" stop-color="#1e3a8a"/>
        <stop offset="100%" stop-color="#090d16"/>
      </radialGradient>
      <rect x="290" y="85" width="220" height="270" fill="url(#portrait-grad)"/>

      <!-- Stylized Vector Portrait Head & Shoulders -->
      <circle cx="400" cy="175" r="45" fill="#e2e8f0"/>
      <!-- Suit & Collar -->
      <path d="M335 320 C345 245, 370 235, 400 235 C430 235, 455 245, 465 320 Z" fill="#1e293b"/>
      <path d="M375 240 L400 280 L425 240 Z" fill="#ffffff"/>
      <path d="M394 250 L406 250 L402 310 L398 310 Z" fill="#f59e0b"/>
      <!-- Dark Noir Sunglasses -->
      <rect x="370" y="165" width="26" height="13" rx="4" fill="#090d16"/>
      <rect x="404" y="165" width="26" height="13" rx="4" fill="#090d16"/>
      <line x1="396" y1="171" x2="404" y2="171" stroke="#090d16" stroke-width="2"/>
    </g>

    <!-- Z-Space Tag on Portrait -->
    <rect x="330" y="325" width="140" height="22" rx="4" fill="rgba(10,15,30,0.92)" stroke="#38bdf8" stroke-width="1"/>
    <text x="400" y="340" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">PORTRAIT CUTOUT (Z:0px)</text>
  </g>

  <!-- LAYER 4: Foreground 3D Text & Spatial Null Card (Z: +160px) -->
  <g transform="translate(230, 255)" filter="url(#shadow-deep)">
    <rect width="340" height="96" rx="12" fill="rgba(8,10,18,0.92)" stroke="url(#gold-grad)" stroke-width="2"/>
    <!-- Gold Ambient Glow Pill -->
    <rect x="20" y="14" width="210" height="18" rx="4" fill="rgba(245,158,11,0.18)" stroke="#f59e0b" stroke-width="1"/>
    <text x="30" y="26" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" letter-spacing="1">
      MAGNATES MEDIA // 3D PROJECTION
    </text>
    
    <!-- Bold Cinematic Headline -->
    <text x="20" y="58" fill="#ffffff" font-family="'Cinzel', 'Playfair Display', serif" font-size="22" font-weight="900" letter-spacing="1.5">
      THE BILLIONAIRE PLAYBOOK
    </text>

    <!-- Subtitle / Z-Depth specs -->
    <text x="20" y="78" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">
      50mm CAMERA RIG // Z-SEPARATION: 160PX
    </text>
  </g>

  <!-- Floating 3D Spatial Depth Indicator Pill (Top Right) -->
  <g transform="translate(560, 28)" filter="url(#shadow-deep)">
    <rect width="210" height="34" rx="17" fill="rgba(15,23,42,0.9)" stroke="rgba(245,158,11,0.6)" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="5" fill="#f59e0b" filter="url(#glow-gold)"/>
    <text x="34" y="21" fill="#fef08a" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.5">
      CORE 3D &amp; SPATIAL FX
    </text>
  </g>

  <!-- Top Left Badge -->
  <g transform="translate(30, 28)">
    <rect width="180" height="28" rx="6" fill="rgba(245,158,11,0.2)" stroke="#f59e0b" stroke-width="1"/>
    <text x="90" y="18" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle">MAGNATES MEDIA 3D</text>
  </g>
</svg>
