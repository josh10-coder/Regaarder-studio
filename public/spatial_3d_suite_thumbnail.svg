<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0d121f" />
      <stop offset="65%" stop-color="#06080f" />
      <stop offset="100%" stop-color="#020306" />
    </radialGradient>
    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#d97706" />
      <stop offset="55%" stop-color="#fde68a" />
      <stop offset="80%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="heavyAO" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="rgba(0,0,0,0.95)" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGlow)" />

  <!-- Clean Architectural Perspective Floor Grid -->
  <g stroke="rgba(148,163,184,0.09)" stroke-width="1.2">
    <line x1="400" y1="230" x2="-240" y2="450" />
    <line x1="400" y1="230" x2="-40" y2="450" />
    <line x1="400" y1="230" x2="130" y2="450" />
    <line x1="400" y1="230" x2="270" y2="450" />
    <line x1="400" y1="230" x2="400" y2="450" />
    <line x1="400" y1="230" x2="530" y2="450" />
    <line x1="400" y1="230" x2="670" y2="450" />
    <line x1="400" y1="230" x2="840" y2="450" />
    <line x1="400" y1="230" x2="1040" y2="450" />
    <line x1="80" y1="290" x2="720" y2="290" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="-40" y1="410" x2="840" y2="410" />
  </g>

  <!-- Left Corridor Flanking Plate -->
  <g transform="translate(24, 68) skewY(6)" filter="url(#heavyAO)">
    <rect width="176" height="144" rx="8" fill="#0b0f19" stroke="rgba(255,255,255,0.16)" stroke-width="1.5" />
    <rect x="4" y="4" width="168" height="88" rx="6" fill="#161f33" />
    <line x1="4" y1="92" x2="172" y2="92" stroke="#d97706" stroke-width="1.5" />
    <rect x="12" y="12" width="48" height="16" rx="3" fill="#991b1b" />
    <text x="36" y="23" fill="#ffffff" font-family="monospace" font-size="9" font-weight="800" text-anchor="middle">VERIFIED</text>
    <text x="12" y="110" fill="#f59e0b" font-family="monospace" font-size="8.5" font-weight="700">DEPT. TREASURY</text>
    <text x="12" y="128" fill="#f8fafc" font-family="Georgia, serif" font-size="12.5" font-weight="700">CONFIDENTIAL SCAN</text>
  </g>

  <!-- Right Corridor Flanking Plate -->
  <g transform="translate(600, 228) skewY(-6)" filter="url(#heavyAO)">
    <rect width="176" height="144" rx="8" fill="#0b0f19" stroke="rgba(255,255,255,0.16)" stroke-width="1.5" />
    <rect x="4" y="4" width="168" height="88" rx="6" fill="#131c2e" />
    <line x1="4" y1="92" x2="172" y2="92" stroke="#d97706" stroke-width="1.5" />
    <text x="12" y="110" fill="#94a3b8" font-family="monospace" font-size="8.5" font-weight="700">MONOPOLY LEDGER</text>
    <text x="12" y="128" fill="#f8fafc" font-family="Georgia, serif" font-size="12" font-weight="700">CAPITAL FLOW $84.2B</text>
  </g>

  <!-- Center Runway Hero Title -->
  <g transform="translate(400, 212)" filter="url(#heavyAO)">
    <text x="0" y="-10" fill="url(#goldBevel)" font-family="'Cinzel', 'Times New Roman', Georgia, serif" font-weight="900" font-size="44" letter-spacing="8" text-anchor="middle">THE SYSTEM</text>
    <line x1="-150" y1="12" x2="150" y2="12" stroke="url(#goldBevel)" stroke-width="2" opacity="0.85" />
    <text x="0" y="36" fill="#cbd5e1" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="13" letter-spacing="5" text-anchor="middle">MANIPULATION &amp; CONTROL</text>
  </g>
</svg>
