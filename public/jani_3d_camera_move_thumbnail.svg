<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Space Gradients -->
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#181534" />
      <stop offset="60%" stop-color="#0a0a18" />
      <stop offset="100%" stop-color="#030308" />
    </radialGradient>
    <radialGradient id="coreIndigo" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#4338ca" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Card Shadows -->
    <filter id="shadow3D" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-15" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4f46e5" flood-opacity="0.3" />
    </filter>

    <!-- Glowing Text Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Perspective Space Canvas -->
  <rect width="800" height="450" fill="url(#spaceBg)" />
  <circle cx="400" cy="225" r="320" fill="url(#coreIndigo)" />

  <!-- 3D Perspective Grid / Wireframe Floor -->
  <g stroke="#6366f1" stroke-opacity="0.18" stroke-width="1.2">
    <!-- Perspective lines receding to center vanishing point (400, 210) -->
    <line x1="400" y1="210" x2="-100" y2="450" />
    <line x1="400" y1="210" x2="80" y2="450" />
    <line x1="400" y1="210" x2="240" y2="450" />
    <line x1="400" y1="210" x2="400" y2="450" stroke-opacity="0.35" />
    <line x1="400" y1="210" x2="560" y2="450" />
    <line x1="400" y1="210" x2="720" y2="450" />
    <line x1="400" y1="210" x2="900" y2="450" />

    <!-- Horizontal ground grid bars -->
    <line x1="320" y1="250" x2="480" y2="250" stroke-opacity="0.1" />
    <line x1="250" y1="285" x2="550" y2="285" stroke-opacity="0.15" />
    <line x1="160" y1="335" x2="640" y2="335" stroke-opacity="0.22" />
    <line x1="40" y1="400" x2="760" y2="400" stroke-opacity="0.3" />
  </g>

  <!-- Layer 1: Background Archival Card (Tilted in 3D Space, Z = -100) -->
  <g transform="translate(400, 195) rotate(-6) skewX(-10) scale(0.9)" filter="url(#shadow3D)">
    <rect x="-240" y="-120" width="480" height="240" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <line x1="-210" y1="-70" x2="210" y2="-70" stroke="#475569" stroke-width="1" stroke-dasharray="4 4" />
    <text x="-210" y="-85" font-family="monospace" font-size="9" fill="#94a3b8" letter-spacing="1.5">3D_WORKSPACE // CAMERA_TRACKING: 650PX</text>
    <rect x="-210" y="-40" width="160" height="12" rx="3" fill="#1e293b" />
    <rect x="-210" y="-15" width="280" height="8" rx="2" fill="#1e293b" />
    <rect x="-210" y="5" width="220" height="8" rx="2" fill="#1e293b" />
  </g>

  <!-- Layer 2: Foreground 3D Floating Typography Plate (Z = +150, Tilted in 3D) -->
  <g transform="translate(400, 240) rotate(5) skewY(-2) scale(1.05)" filter="url(#shadow3D)">
    <rect x="-260" y="-60" width="520" height="120" rx="16" fill="#0b0d19" fill-opacity="0.95" stroke="#6366f1" stroke-width="2" />
    <circle cx="-230" cy="-35" r="4" fill="#a855f7" />
    <circle cx="-215" cy="-35" r="4" fill="#6366f1" />
    <text x="-195" y="-32" font-family="monospace" font-size="9.5" font-weight="800" fill="#a5b4fc" letter-spacing="2">3D LAYER MAPPING // X-Y ROTATION</text>
    
    <text x="0" y="24" 
          font-family="'Inter', -apple-system, sans-serif" 
          font-size="44" 
          font-weight="900" 
          letter-spacing="6" 
          text-anchor="middle" 
          fill="#ffffff" 
          filter="url(#neonGlow)">
      SPATIAL DEPTH
    </text>
  </g>

  <!-- 3D Coordinates Vector Ring & Camera Target Reticle -->
  <g transform="translate(400, 240)">
    <ellipse cx="0" cy="0" rx="340" ry="85" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="6 6" stroke-opacity="0.4" transform="rotate(-8)" />
    <!-- Camera Position Tag -->
    <rect x="180" y="55" width="130" height="24" rx="12" fill="#4338ca" stroke="#818cf8" stroke-width="1" />
    <text x="245" y="71" font-family="monospace" font-size="9" font-weight="800" fill="#e0e7ff" text-anchor="middle" letter-spacing="1">Z-PULLBACK: -650</text>
  </g>

  <!-- Header HUD Badges -->
  <g transform="translate(35, 45)">
    <rect width="185" height="26" rx="6" fill="#111328" stroke="#6366f1" stroke-width="1" stroke-opacity="0.6"/>
    <text x="14" y="17" font-family="monospace" font-size="10" font-weight="800" fill="#a5b4fc" letter-spacing="1.5">3D CAMERA MOVE // ROTATE</text>
  </g>

  <g transform="translate(635, 45)">
    <rect width="130" height="26" rx="6" fill="#111328" stroke="#a855f7" stroke-width="1" stroke-opacity="0.6"/>
    <text x="12" y="17" font-family="monospace" font-size="10" font-weight="800" fill="#d8b4fe" letter-spacing="1.5">ROT: ±14° // DEPTH</text>
  </g>
</svg>
