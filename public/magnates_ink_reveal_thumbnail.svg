<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ink-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0512"/>
      <stop offset="40%" stop-color="#140722"/>
      <stop offset="100%" stop-color="#05020a"/>
    </linearGradient>
    <radialGradient id="ink-bleed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#7c3aed" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#4c1d95" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="bleed-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Dark Parchment Background -->
  <rect width="800" height="450" fill="url(#ink-bg)"/>

  <!-- Organic Ink Splash & Bleed Droplets -->
  <circle cx="400" cy="225" r="180" fill="url(#ink-bleed)" filter="url(#bleed-blur)"/>
  
  <!-- Ink Splatter Details -->
  <g fill="#c084fc" opacity="0.65" filter="url(#bleed-blur)">
    <circle cx="210" cy="180" r="14"/>
    <circle cx="240" cy="140" r="8"/>
    <circle cx="580" cy="270" r="18"/>
    <circle cx="610" cy="220" r="10"/>
    <circle cx="340" cy="330" r="16"/>
    <circle cx="480" cy="120" r="12"/>
    <path d="M 220 180 Q 260 210, 310 200 Q 320 230, 290 240 Z"/>
    <path d="M 520 220 Q 560 200, 600 240 Q 580 270, 530 250 Z"/>
  </g>

  <!-- Vintage Chapter Numerals -->
  <text x="400" y="145" font-family="'Cinzel', 'Georgia', serif" font-size="16" font-weight="bold" fill="#e9d5ff" letter-spacing="8" text-anchor="middle">CHAPTER IV</text>
  <line x1="320" y1="160" x2="480" y2="160" stroke="#a855f7" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Dramatic Serif Bleed Title -->
  <text x="400" y="245" font-family="'Cinzel', 'Playfair Display', serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="6" text-anchor="middle" filter="drop-shadow(0 0 20px rgba(168,85,247,0.8))">
    THE INHERITANCE
  </text>

  <!-- Stretchy Typography Accent Line -->
  <g transform="translate(180, 275)">
    <line x1="0" y1="0" x2="440" y2="0" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4,2"/>
    <circle cx="220" cy="0" r="5" fill="#f59e0b"/>
  </g>

  <!-- Subtitle Tagline with Date Callout -->
  <text x="400" y="315" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#d8b4fe" letter-spacing="3" text-anchor="middle">
    OCTOBER 24, 1929  //  WALL STREET CRASH
  </text>

  <!-- Ink Fountain Pen Nib Silhouette -->
  <g transform="translate(620, 260) rotate(-35)" opacity="0.85">
    <path d="M 0 0 L 25 -70 L 40 -60 L 15 10 Z" fill="#e2e8f0"/>
    <path d="M 12 5 L 0 0 L 2 -15 Z" fill="#f59e0b"/>
    <circle cx="10" cy="-20" r="3" fill="#090412"/>
    <line x1="10" y1="-20" x2="0" y2="0" stroke="#090412" stroke-width="1.5"/>
  </g>

  <!-- Framing Ornamental Corners -->
  <path d="M 40 50 L 40 30 L 60 30" stroke="#c084fc" stroke-width="2" fill="none"/>
  <path d="M 760 50 L 760 30 L 740 30" stroke="#c084fc" stroke-width="2" fill="none"/>
  <path d="M 40 400 L 40 420 L 60 420" stroke="#c084fc" stroke-width="2" fill="none"/>
  <path d="M 760 400 L 760 420 L 740 420" stroke="#c084fc" stroke-width="2" fill="none"/>

  <!-- Badge Overlay -->
  <g transform="translate(560, 30)">
    <rect width="210" height="34" rx="8" fill="#7c3aed" opacity="0.95"/>
    <text x="105" y="22" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">✒️ INK REVEAL TITLE</text>
  </g>
</svg>
