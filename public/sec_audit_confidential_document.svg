<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#020305"/>
    </radialGradient>

    <!-- Paper Sheet Drop Shadow -->
    <filter id="paper-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Subtle Paper Fiber Grain Filter -->
    <filter id="paper-texture">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.98  0 0 0 0 0.96  0 0 0 0 0.92  0 0 0 0.06 0"/>
      <feBlend mode="multiply" in="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Dark Atmospheric Backdrop -->
  <rect width="1920" height="1080" fill="url(#vignette)"/>

  <!-- Perspective Paper Sheet (Centered, Realistic Document Proportion) -->
  <g transform="translate(260, 50)" filter="url(#paper-shadow)">
    <!-- Main Archival Document Page -->
    <rect width="1400" height="980" rx="4" fill="#faf6ec" stroke="#d5cdb9" stroke-width="2"/>

    <!-- Subtle Grid / Margin Guidelines -->
    <line x1="80" y1="40" x2="80" y2="940" stroke="#e7dfcb" stroke-width="1.5" stroke-dasharray="6,4"/>
    <line x1="1320" y1="40" x2="1320" y2="940" stroke="#e7dfcb" stroke-width="1.5" stroke-dasharray="6,4"/>

    <!-- Official Seal & Header Bar -->
    <g transform="translate(120, 70)">
      <!-- Government / SEC Style Eagle Emblem Silhouette -->
      <circle cx="45" cy="45" r="40" fill="none" stroke="#1c2434" stroke-width="3"/>
      <circle cx="45" cy="45" r="33" fill="none" stroke="#1c2434" stroke-width="1"/>
      <polygon points="45,18 49,30 62,30 52,38 55,50 45,43 35,50 38,38 28,30 41,30" fill="#1c2434"/>
      <text x="45" y="70" font-family="'Times New Roman', serif" font-size="7" font-weight="900" text-anchor="middle" letter-spacing="1" fill="#1c2434">OFFICIAL SEAL</text>

      <!-- Department Typography -->
      <text x="110" y="30" font-family="'Times New Roman', 'Georgia', serif" font-size="22" font-weight="900" letter-spacing="2" fill="#0f172a">UNITED STATES REGULATORY OVERSIGHT COMMISSION</text>
      <text x="110" y="54" font-family="'Courier New', monospace" font-size="13" font-weight="700" letter-spacing="1" fill="#475569">SPECIAL INVESTIGATION DIVISION • DIVISION OF ENFORCEMENT</text>
      <text x="110" y="74" font-family="'Courier New', monospace" font-size="11" fill="#64748b">100 F STREET, N.E., WASHINGTON, D.C. 20549 • OFFICIAL EXHIBIT RECORD</text>
    </g>

    <!-- Top Divider Rule -->
    <line x1="120" y1="175" x2="1280" y2="175" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="120" y1="180" x2="1280" y2="180" stroke="#0f172a" stroke-width="0.8"/>

    <!-- Red Rotated Classified / Subpoena Stamp (Top Right) -->
    <g transform="translate(1030, 85) rotate(-6)">
      <rect width="230" height="54" rx="2" fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray="24, 2"/>
      <rect x="4" y="4" width="222" height="46" rx="1" fill="rgba(185, 28, 28, 0.08)"/>
      <text x="115" y="27" font-family="'Courier New', monospace" font-size="15" font-weight="900" fill="#b91c1c" letter-spacing="2" text-anchor="middle">SUBPOENA EXHIBIT</text>
      <text x="115" y="44" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#b91c1c" letter-spacing="1.5" text-anchor="middle">CONFIDENTIAL // LEAKED</text>
    </g>

    <!-- Metadata Case Block -->
    <g transform="translate(120, 205)">
      <rect width="1160" height="70" fill="#f1ece0" stroke="#d5cdb9" stroke-width="1"/>
      <text x="25" y="28" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#334155">CASE FILE: <tspan font-weight="900" fill="#0f172a">SEC-NY-2024-8841-DIV</tspan></text>
      <text x="390" y="28" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#334155">TARGET ENTITY: <tspan font-weight="900" fill="#0f172a">APEX GLOBAL CAPITAL LLC</tspan></text>
      <text x="820" y="28" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#334155">DATE LOGGED: <tspan font-weight="900" fill="#0f172a">DECEMBER 08, 2024</tspan></text>

      <text x="25" y="52" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#334155">SUBJECT: <tspan font-weight="900" fill="#0f172a">FORENSIC AUDIT OF UNDISCLOSED CAPITAL TRANSFERS</tspan></text>
      <text x="820" y="52" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#b91c1c">CLASSIFICATION: HIGH PRIORITY</text>
    </g>

    <!-- Document Headline -->
    <text x="120" y="325" font-family="'Times New Roman', serif" font-size="26" font-weight="900" fill="#0f172a" letter-spacing="0.5">
      MEMORANDUM OF INVESTIGATION: SECTION 4 — FINDINGS OF FACT
    </text>

    <!-- Primary Evidence Paragraph (Where Whiteout / Spotlight Focus & Yellow Sweep lands) -->
    <g transform="translate(120, 350)">
      <!-- Paragraph Line 1 -->
      <text x="0" y="25" font-family="'Courier New', monospace" font-size="17" font-weight="600" fill="#1e293b" letter-spacing="0.2">
        12. Between November 14 and December 02, internal SWIFT clearing logs cross-referenced against
      </text>

      <!-- Paragraph Line 2 (Yellow Highlight Target) -->
      <text x="0" y="60" font-family="'Courier New', monospace" font-size="17.5" font-weight="800" fill="#0f172a" letter-spacing="0.2">
        clearing routing archives revealed 14 consecutive unrecorded wire transfers totaling $482,000,000.
      </text>

      <!-- Paragraph Line 3 -->
      <text x="0" y="95" font-family="'Courier New', monospace" font-size="17" font-weight="600" fill="#1e293b" letter-spacing="0.2">
        These capital outflows were routed through unregistered intermediary entity Apex Holdings BVI
      </text>

      <!-- Paragraph Line 4 (Red Highlight Target / Smoking Gun) -->
      <text x="0" y="130" font-family="'Courier New', monospace" font-size="17.5" font-weight="800" fill="#0f172a" letter-spacing="0.2">
        without disclosure to shareholders, board members, or regulatory oversight bodies.
      </text>

      <!-- Paragraph Line 5 -->
      <text x="0" y="165" font-family="'Courier New', monospace" font-size="17" font-weight="600" fill="#1e293b" letter-spacing="0.2">
        13. Hand-annotated ledger records recovered from the Chief Financial Officer's private office
      </text>

      <!-- Paragraph Line 6 (Forensic Loupe Target) -->
      <text x="0" y="200" font-family="'Courier New', monospace" font-size="17" font-weight="700" fill="#0f172a" letter-spacing="0.2">
        explicitly corroborate executive awareness prior to the December 08 public financial call.
      </text>

      <!-- Handwritten Red Annotation Margin Note -->
      <g transform="translate(970, 75) rotate(-4)">
        <text font-family="'Brush Script MT', 'Caveat', cursive, sans-serif" font-size="24" fill="#dc2626" font-weight="bold">
          "Do not disclose to auditors!"
        </text>
        <path d="M 10 32 Q 120 40 220 28" stroke="#dc2626" stroke-width="2" fill="none"/>
      </g>
    </g>

    <!-- Secondary Context & Redacted Records -->
    <g transform="translate(120, 610)">
      <line x1="0" y1="0" x2="1160" y2="0" stroke="#cbd5e1" stroke-width="1.5"/>

      <text x="0" y="35" font-family="'Times New Roman', serif" font-size="18" font-weight="900" fill="#334155">
        CONFIDENTIAL DEPOSITION TRANSCRIPTS // WITNESS TESTIMONY:
      </text>

      <text x="0" y="70" font-family="'Courier New', monospace" font-size="15" fill="#334155">
        Q: "Did senior managing partners approve the routing through off-ledger entities?"
      </text>
      <text x="0" y="100" font-family="'Courier New', monospace" font-size="15" fill="#334155">
        A: "Every transaction was signed off directly by <rect x="370" y="87" width="160" height="16" fill="#0f172a"/> and verified by legal counsel on November 18."
      </text>

      <text x="0" y="140" font-family="'Courier New', monospace" font-size="15" fill="#334155">
        Q: "Was there any intent to rectify the $482M deficit before the annual SEC 10-K filing?"
      </text>
      <text x="0" y="170" font-family="'Courier New', monospace" font-size="15" fill="#334155">
        A: "No. The instruction was strictly to keep the subsidiary accounts unlinked until Q2."
      </text>
    </g>

    <!-- Bottom Barcode & Footer Verification Stamp -->
    <g transform="translate(120, 860)">
      <line x1="0" y1="0" x2="1160" y2="0" stroke="#0f172a" stroke-width="1.5"/>

      <!-- Barcode simulation -->
      <g transform="translate(0, 15)">
        <rect x="0" y="0" width="3" height="42" fill="#0f172a"/>
        <rect x="6" y="0" width="6" height="42" fill="#0f172a"/>
        <rect x="16" y="0" width="2" height="42" fill="#0f172a"/>
        <rect x="22" y="0" width="8" height="42" fill="#0f172a"/>
        <rect x="34" y="0" width="3" height="42" fill="#0f172a"/>
        <rect x="42" y="0" width="5" height="42" fill="#0f172a"/>
        <rect x="52" y="0" width="8" height="42" fill="#0f172a"/>
        <rect x="65" y="0" width="2" height="42" fill="#0f172a"/>
        <rect x="72" y="0" width="6" height="42" fill="#0f172a"/>
        <rect x="84" y="0" width="4" height="42" fill="#0f172a"/>
        <rect x="94" y="0" width="7" height="42" fill="#0f172a"/>
        <rect x="106" y="0" width="3" height="42" fill="#0f172a"/>
        <rect x="114" y="0" width="5" height="42" fill="#0f172a"/>
        <rect x="124" y="0" width="9" height="42" fill="#0f172a"/>
        <text x="0" y="56" font-family="'Courier New', monospace" font-size="9" fill="#475569">*DOC-SEC-8841-EX44B*</text>
      </g>

      <text x="240" y="32" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#475569">
        CERTIFIED TRUE COPY OF OFFICIAL GOVERNMENT ARCHIVE
      </text>
      <text x="240" y="48" font-family="'Courier New', monospace" font-size="10" fill="#64748b">
        PAGE 1 OF 1 // EVIDENCE ADMISSIBLE UNDER FRE RULE 803(8)
      </text>

      <!-- Verification Badge -->
      <rect x="1000" y="12" width="160" height="42" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
      <text x="1080" y="30" font-family="'Courier New', monospace" font-size="11" font-weight="900" fill="#0f172a" text-anchor="middle">AUTHENTICATED</text>
      <text x="1080" y="44" font-family="'Courier New', monospace" font-size="9" font-weight="700" fill="#059669" text-anchor="middle">✓ FORENSIC PASS</text>
    </g>
  </g>
</svg>
