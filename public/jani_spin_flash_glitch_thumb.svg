<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#02182b"/>
    </linearGradient>
    <radialGradient id="flashGlow" cx="48%" cy="44%" r="52%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="30%" stop-color="#bae6fd" stop-opacity="0.55"/>
      <stop offset="68%" stop-color="#0284c7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bgGrad)"/>

  <!-- Left Half: Spinning Subject 1 with Falling Particles -->
  <g transform="translate(175, 185) rotate(-11)">
    <rect x="-135" y="-115" width="270" height="230" rx="8" fill="#181311" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
    <image href="/ceo_portrait_cutout.jpg" x="-135" y="-115" width="270" height="230" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- Right Half: Glitch Reveal of Subject 2 -->
  <g clip-path="inset(0 0 0 310px)">
    <image href="/ai_creator_portrait_cutout.png" x="280" y="10" width="340" height="340" preserveAspectRatio="xMidYMid slice" opacity="0.85"/>
    <rect x="300" y="0" width="340" height="360" fill="#00f0ff" opacity="0.22" style="mix-blend-mode: color;"/>
  </g>

  <!-- Circular L->R Spin Arc Doodle Indicator -->
  <path d="M 110 78 C 195 22, 330 24, 415 86" fill="none" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="8 4"/>
  <polygon points="415,86 396,74 405,96" fill="#ef4444"/>

  <!-- Falling Particles -->
  <g fill="#fef3c7" opacity="0.85">
    <circle cx="95" cy="65" r="2.5"/>
    <circle cx="145" cy="120" r="3.2"/>
    <circle cx="230" cy="95" r="2.0"/>
    <circle cx="290" cy="150" r="3.5"/>
    <circle cx="185" cy="240" r="2.8"/>
    <circle cx="480" cy="80" r="2.4" fill="#7dd3fc"/>
    <circle cx="540" cy="175" r="3.0" fill="#7dd3fc"/>
    <circle cx="430" cy="260" r="2.2" fill="#7dd3fc"/>
  </g>

  <!-- Center Strobe Flash + Glitch Slices -->
  <circle cx="310" cy="175" r="145" fill="url(#flashGlow)"/>
  <rect x="240" y="112" width="160" height="8" fill="#00f0ff" opacity="0.85"/>
  <rect x="210" y="178" width="195" height="12" fill="#ffffff" opacity="0.9"/>
  <rect x="260" y="236" width="150" height="7" fill="#f43f5e" opacity="0.8"/>

  <!-- Badge -->
  <rect x="16" y="16" width="236" height="28" rx="6" fill="rgba(9,13,22,0.88)" stroke="rgba(56,189,248,0.5)" stroke-width="1.2"/>
  <text x="28" y="34" fill="#e0f2fe" font-family="monospace" font-size="11" font-weight="800" letter-spacing="1">SPIN • 1+3 FLASH • GLITCH REVEAL</text>
</svg>
