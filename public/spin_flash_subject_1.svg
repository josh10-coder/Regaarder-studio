<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="courtBg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#2c221e"/>
      <stop offset="45%" stop-color="#171210"/>
      <stop offset="100%" stop-color="#060506"/>
    </radialGradient>
    <radialGradient id="warmBokeh1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmBokeh2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette1" cx="50%" cy="48%" r="65%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>
    <filter id="docGrade1">
      <feColorMatrix type="matrix" values="
        1.08 0.02 0.00 0 -0.02
        0.01 1.02 0.00 0 -0.02
        0.00 0.01 0.94 0 -0.01
        0    0    0    1  0"/>
    </filter>
  </defs>

  <!-- Warm Press Hearing / Courtroom Background -->
  <rect width="1280" height="720" fill="url(#courtBg)"/>

  <!-- Out-of-focus architectural wood & warm tungsten bokeh -->
  <g opacity="0.75">
    <rect x="80" y="0" width="140" height="720" fill="#1e1510" opacity="0.5"/>
    <rect x="1040" y="0" width="160" height="720" fill="#1e1510" opacity="0.5"/>
    <circle cx="240" cy="190" r="130" fill="url(#warmBokeh1)"/>
    <circle cx="1020" cy="210" r="150" fill="url(#warmBokeh2)"/>
    <circle cx="180" cy="480" r="110" fill="url(#warmBokeh2)"/>
    <circle cx="1090" cy="460" r="120" fill="url(#warmBokeh1)"/>
    <circle cx="640" cy="120" r="180" fill="url(#warmBokeh1)" opacity="0.5"/>
  </g>

  <!-- Main Subject 1: Executive Portrait in Suit & Tie -->
  <image href="/ceo_portrait_cutout.jpg" x="-40" y="-20" width="1360" height="765" preserveAspectRatio="xMidYMid slice" filter="url(#docGrade1)" style="mix-blend-mode: lighten;"/>
  <image href="/ceo_portrait_cutout.jpg" x="-40" y="-20" width="1360" height="765" preserveAspectRatio="xMidYMid slice" opacity="0.88" filter="url(#docGrade1)"/>

  <!-- Subtle Press Microphones Foreground Silhouette -->
  <g opacity="0.55" fill="#090a0f">
    <rect x="470" y="640" width="10" height="90" rx="4" transform="rotate(-12 470 640)"/>
    <ellipse cx="462" cy="632" rx="18" ry="24" transform="rotate(-12 462 632)" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
    <rect x="790" y="645" width="10" height="90" rx="4" transform="rotate(14 790 645)"/>
    <ellipse cx="800" cy="636" rx="18" ry="24" transform="rotate(14 800 636)" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
  </g>

  <!-- Editorial Vignette -->
  <rect width="1280" height="720" fill="url(#vignette1)"/>
</svg>
