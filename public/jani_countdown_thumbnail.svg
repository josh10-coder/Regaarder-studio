<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for 3D Terminal Monitor -->
    <radialGradient id="janiTerminalRadial" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#140609"/>
      <stop offset="55%" stop-color="#080204"/>
      <stop offset="100%" stop-color="#020001"/>
    </radialGradient>
    
    <!-- Neon Glow Filters -->
    <filter id="crimsonNeonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="volumetricCrimsonFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(239, 68, 68, 0.75)"/>
      <stop offset="40%" stop-color="rgba(185, 28, 28, 0.45)"/>
      <stop offset="75%" stop-color="rgba(69, 10, 10, 0.25)"/>
      <stop offset="100%" stop-color="rgba(8, 2, 4, 0.0)"/>
    </linearGradient>

    <linearGradient id="topSpotlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="rgba(200, 225, 245, 0.25)"/>
      <stop offset="50%" stop-color="rgba(200, 225, 245, 0.05)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </linearGradient>
  </defs>

  <!-- 1. Physical Terminal Frame & Bezel -->
  <rect width="400" height="225" fill="#030406"/>
  
  <!-- Side monitors in bokeh blur -->
  <rect x="0" y="0" width="55" height="225" fill="#070a0e" opacity="0.85"/>
  <rect x="345" y="0" width="55" height="225" fill="#070a0e" opacity="0.85"/>
  <line x1="55" y1="0" x2="55" y2="225" stroke="#18202c" stroke-width="2"/>
  <line x1="345" y1="0" x2="345" y2="225" stroke="#18202c" stroke-width="2"/>

  <!-- Center CRT Curved Monitor Housing -->
  <rect x="58" y="10" width="284" height="205" rx="8" fill="url(#janiTerminalRadial)" stroke="#222732" stroke-width="2"/>
  
  <!-- Overhead spotlight beam -->
  <polygon points="120,0 280,0 310,120 90,120" fill="url(#topSpotlight)" opacity="0.7"/>

  <!-- Technical Grid -->
  <g stroke="rgba(239, 68, 68, 0.08)" stroke-width="0.8">
    <line x1="58" y1="45" x2="342" y2="45"/>
    <line x1="58" y1="80" x2="342" y2="80"/>
    <line x1="58" y1="115" x2="342" y2="115"/>
    <line x1="58" y1="150" x2="342" y2="150"/>
    <line x1="100" y1="10" x2="100" y2="200"/>
    <line x1="150" y1="10" x2="150" y2="200"/>
    <line x1="200" y1="10" x2="200" y2="200"/>
    <line x1="250" y1="10" x2="250" y2="200"/>
    <line x1="300" y1="10" x2="300" y2="200"/>
  </g>

  <!-- Pinned Paper on Top Left Bezel -->
  <polygon points="50,14 74,18 72,42 46,38" fill="#d4d4d8" stroke="#71717a" stroke-width="0.5"/>
  <line x1="52" y1="22" x2="68" y2="25" stroke="#71717a" stroke-width="0.8"/>
  <line x1="52" y1="28" x2="66" y2="30" stroke="#71717a" stroke-width="0.8"/>

  <!-- 2. Typography & Layout Hierarchy (No Collision!) -->
  <!-- Tactical HUD Title -->
  <text x="200" y="38" fill="#e4e4e7" font-family="'Chakra Petch', 'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="2" text-anchor="middle">
    [ FTX LIQUIDITY CRASH ]
  </text>

  <!-- Dedicated HUD Box for Monospace Clock -->
  <rect x="110" y="48" width="180" height="28" rx="5" fill="rgba(15, 4, 6, 0.85)" stroke="rgba(255, 255, 255, 0.28)" stroke-width="1"/>
  <!-- Corner L-brackets on HUD box -->
  <path d="M 110 54 L 110 48 L 116 48" fill="none" stroke="#fff" stroke-width="1.5"/>
  <path d="M 290 54 L 290 48 L 284 48" fill="none" stroke="#fff" stroke-width="1.5"/>
  <path d="M 110 70 L 110 76 L 116 76" fill="none" stroke="#fff" stroke-width="1.5"/>
  <path d="M 290 70 L 290 76 L 284 76" fill="none" stroke="#fff" stroke-width="1.5"/>

  <!-- Monospace Digits with Phosphor Bloom -->
  <text x="200" y="68" fill="#ffffff" font-family="'JetBrains Mono', 'Share Tech Mono', monospace" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="1" filter="url(#crimsonNeonGlow)">
    T-MINUS 00:06.170
  </text>

  <!-- 3. Volumetric Area Chart & Candlestick Drops -->
  <path d="M 60 115 L 85 108 L 115 125 L 140 102 L 165 118 L 185 95 L 210 135 L 235 110 L 255 148 L 275 130 L 305 165 L 340 172 L 340 190 L 60 190 Z" fill="url(#volumetricCrimsonFill)"/>
  
  <!-- Candlesticks in Area -->
  <g stroke="#ef4444" stroke-width="0.8">
    <line x1="95" y1="108" x2="95" y2="128"/><rect x="93" y="112" width="4" height="10" fill="#dc2626"/>
    <line x1="130" y1="104" x2="130" y2="132"/><rect x="128" y="110" width="4" height="14" fill="#dc2626"/>
    <line x1="175" y1="98" x2="175" y2="136"/><rect x="173" y="105" width="4" height="20" fill="#dc2626"/>
    <line x1="220" y1="112" x2="220" y2="148"/><rect x="218" y="120" width="4" height="18" fill="#dc2626"/>
    <line x1="265" y1="130" x2="265" y2="162"/><rect x="263" y="136" width="4" height="16" fill="#dc2626"/>
    <line x1="295" y1="145" x2="295" y2="174"/><rect x="293" y="150" width="4" height="15" fill="#dc2626"/>
  </g>

  <!-- Glowing Neon Top Contour Line -->
  <path d="M 60 115 L 85 108 L 115 125 L 140 102 L 165 118 L 185 95 L 210 135 L 235 110 L 255 148 L 275 130 L 305 165 L 340 172" fill="none" stroke="#ff2a4b" stroke-width="2.5" filter="url(#crimsonNeonGlow)"/>

  <!-- Key Trigger Node -->
  <circle cx="210" cy="135" r="3.5" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>

  <!-- Dramatic Subtitle -->
  <text x="200" y="180" fill="#f4f4f5" font-family="'Playfair Display', serif" font-style="italic" font-size="7.5" text-anchor="middle">
    "And in less than 48 hours... $32 Billion vanished into thin air."
  </text>

  <!-- Pinned Paper on Bottom Right Bezel -->
  <polygon points="305,185 348,175 352,215 310,218" fill="#f4f4f5" stroke="#71717a" stroke-width="0.5"/>
  <text x="312" y="188" fill="#18181b" font-family="'Inter', sans-serif" font-size="4" font-weight="800">FTX LIQUIDITY</text>
  <line x1="312" y1="194" x2="340" y2="192" stroke="#71717a" stroke-width="0.6"/>
  <line x1="312" y1="198" x2="338" y2="196" stroke="#71717a" stroke-width="0.6"/>

  <!-- 4. Cinematic Panic Ticker Tape at Bottom -->
  <rect x="58" y="192" width="284" height="22" fill="rgba(8, 2, 4, 0.96)"/>
  <line x1="58" y1="192" x2="342" y2="192" stroke="#ef4444" stroke-width="1.2"/>
  
  <!-- Red Pill Badges -->
  <rect x="64" y="196" width="46" height="13" rx="3" fill="#dc2626"/>
  <text x="87" y="205.5" fill="#ffffff" font-family="'Share Tech Mono', monospace" font-size="6.5" font-weight="700" text-anchor="middle">FTX -94.2%</text>

  <rect x="114" y="196" width="46" height="13" rx="3" fill="#dc2626"/>
  <text x="137" y="205.5" fill="#ffffff" font-family="'Share Tech Mono', monospace" font-size="6.5" font-weight="700" text-anchor="middle">FTT -94.2%</text>

  <text x="166" y="205.5" fill="#fca5a5" font-family="'Share Tech Mono', monospace" font-size="6.5" font-weight="600">
    | $BTC $15,820 (-22.4%) | BINANCE PAUSED
  </text>

  <!-- CRT Scanlines Overlay Simulation -->
  <g opacity="0.08">
    <line x1="58" y1="20" x2="342" y2="20" stroke="#000" stroke-width="1"/>
    <line x1="58" y1="35" x2="342" y2="35" stroke="#000" stroke-width="1"/>
    <line x1="58" y1="50" x2="342" y2="50" stroke="#000" stroke-width="1"/>
    <line x1="58" y1="65" x2="342" y2="65" stroke="#000" stroke-width="1"/>
    <line x1="58" y1="80" x2="342" y2="80" stroke="#000" stroke-width="1"/>
    <line x1="58" y1="95" x2="342" y2="95" stroke="#000" stroke-width="1"/>
    <line x1="58" y1="110" x2="342" y2="110" stroke="#000" stroke-width="1"/>
    <line x1="58" y1="125" x2="342" y2="125" stroke="#000" stroke-width="1"/>
    <line x1="58" y1="140" x2="342" y2="140" stroke="#000" stroke-width="1"/>
    <line x1="58" y1="155" x2="342" y2="155" stroke="#000" stroke-width="1"/>
    <line x1="58" y1="170" x2="342" y2="170" stroke="#000" stroke-width="1"/>
    <line x1="58" y1="185" x2="342" y2="185" stroke="#000" stroke-width="1"/>
  </g>
</svg>
