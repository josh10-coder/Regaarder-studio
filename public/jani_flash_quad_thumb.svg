<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <radialGradient id="flashGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#e0f2fe" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bgGrad)"/>

  <!-- Subtle Grid -->
  <g stroke="rgba(148,163,184,0.07)" stroke-width="1">
    <line x1="0" y1="90" x2="640" y2="90"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="270" x2="640" y2="270"/>
    <line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
  </g>

  <!-- Beat 2 Card (Left to Right) -->
  <g transform="translate(58, 74) rotate(-4)">
    <rect width="210" height="135" rx="6" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.55"/>
    <text x="14" y="24" fill="#38bdf8" font-family="Inter, sans-serif" font-weight="800" font-size="10" letter-spacing="1">02 · L → R SLIDE</text>
    <path d="M25 75 L155 75 M142 63 L157 75 L142 87" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Beat 3 Card (Right to Left) -->
  <g transform="translate(372, 82) rotate(4)">
    <rect width="210" height="135" rx="6" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.55"/>
    <text x="14" y="24" fill="#c084fc" font-family="Inter, sans-serif" font-weight="800" font-size="10" letter-spacing="1">03 · R → L COUNTER</text>
    <path d="M185 75 L55 75 M68 63 L53 75 L68 87" stroke="#c084fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Beat 4 Center Emergence Frame -->
  <g transform="translate(175, 88)">
    <rect width="290" height="184" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <rect x="8" y="8" width="274" height="168" rx="4" fill="#020617"/>
    <circle cx="145" cy="92" r="68" fill="none" stroke="rgba(245,158,11,0.3)" stroke-width="1.5" stroke-dasharray="5,4"/>
    <circle cx="145" cy="92" r="42" fill="none" stroke="rgba(245,158,11,0.6)" stroke-width="1.5"/>
    <text x="145" y="42" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-weight="900" font-size="11" letter-spacing="1.5">01 · FLASH  +  04 · SLUGGISH EMERGE</text>
    <text x="145" y="154" text-anchor="middle" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-weight="600" font-size="9.5">PSYCHOLOGICAL 4-BEAT PHOTO ENGINE</text>
  </g>

  <!-- Camera Flash Starburst Overlay -->
  <circle cx="320" cy="175" r="190" fill="url(#flashGlow)"/>
  <line x1="120" y1="175" x2="520" y2="175" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.85"/>
  <line x1="320" y1="45" x2="320" y2="305" stroke="#ffffff" stroke-width="2" stroke-opacity="0.65"/>

  <!-- Bottom HUD Pill -->
  <rect x="170" y="308" width="300" height="28" rx="14" fill="rgba(15,23,42,0.9)" stroke="rgba(56,189,248,0.4)" stroke-width="1"/>
  <text x="320" y="326" text-anchor="middle" fill="#f8fafc" font-family="Inter, sans-serif" font-weight="800" font-size="10.5" letter-spacing="1.2">📸 FLASH · ↔ DIRECTIONAL · 🌀 SLUGGISH</text>
</svg>
