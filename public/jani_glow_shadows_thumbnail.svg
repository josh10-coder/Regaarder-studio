<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background & Depth Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="50%" stop-color="#0a0518" />
      <stop offset="100%" stop-color="#030108" />
    </radialGradient>
    <radialGradient id="ambientPurple" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ambientAmber" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Heavy Gaussian Glow Filters -->
    <filter id="heavyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Deep Drop Shadow -->
    <filter id="deepDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.95" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Deep Noir Background with Radial Lighting -->
  <rect width="800" height="450" fill="url(#bgGlow)" />
  <circle cx="400" cy="225" r="320" fill="url(#ambientPurple)" />
  <circle cx="400" cy="225" r="240" fill="url(#ambientAmber)" />

  <!-- Subtle Film Vignette Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="450" />
    <line x1="240" y1="0" x2="240" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" stroke-opacity="0.08" />
    <line x1="560" y1="0" x2="560" y2="450" />
    <line x1="720" y1="0" x2="720" y2="450" />
    <line x1="0" y1="112" x2="800" y2="112" />
    <line x1="0" y1="225" x2="800" y2="225" stroke-opacity="0.08" />
    <line x1="0" y1="338" x2="800" y2="338" />
  </g>

  <!-- Layer 1: DUPLICATED BOTTOM GLOW LAYER (Heavy Radius, Low Intensity) -->
  <text x="400" y="240" 
        font-family="'Inter', -apple-system, sans-serif" 
        font-size="64" 
        font-weight="900" 
        letter-spacing="12" 
        text-anchor="middle" 
        fill="#c084fc" 
        opacity="0.85" 
        filter="url(#heavyGlow)">
    THE ILLUSION
  </text>

  <!-- Amber Halo Secondary Bottom Glow -->
  <text x="400" y="240" 
        font-family="'Inter', -apple-system, sans-serif" 
        font-size="64" 
        font-weight="900" 
        letter-spacing="12" 
        text-anchor="middle" 
        fill="#f59e0b" 
        opacity="0.5" 
        filter="url(#softGlow)">
    THE ILLUSION
  </text>

  <!-- Layer 2: TOP SHARP LAYER WITH SOFT DROP SHADOW (Maximum Contrast) -->
  <text x="400" y="240" 
        font-family="'Inter', -apple-system, sans-serif" 
        font-size="64" 
        font-weight="900" 
        letter-spacing="12" 
        text-anchor="middle" 
        fill="#ffffff" 
        filter="url(#deepDropShadow)">
    THE ILLUSION
  </text>

  <!-- Subcaption Tagline Plate -->
  <g transform="translate(400, 305)">
    <rect x="-180" y="-16" width="360" height="32" rx="16" fill="#000000" fill-opacity="0.8" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.5" />
    <text x="0" y="5" 
          font-family="monospace" 
          font-size="11" 
          font-weight="800" 
          letter-spacing="3" 
          text-anchor="middle" 
          fill="#e9d5ff">
      DUPLICATED LAYER GLOW + DROP SHADOW
    </text>
  </g>

  <!-- Corner Badges and HUD -->
  <g transform="translate(35, 45)">
    <rect width="180" height="26" rx="6" fill="#120826" stroke="#9333ea" stroke-width="1" stroke-opacity="0.6"/>
    <text x="14" y="17" font-family="monospace" font-size="10" font-weight="800" fill="#c084fc" letter-spacing="1.5">JAMES JANI // SIGNATURE</text>
  </g>

  <g transform="translate(620, 45)">
    <rect width="145" height="26" rx="6" fill="#1e1035" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.6"/>
    <text x="12" y="17" font-family="monospace" font-size="10" font-weight="800" fill="#fbbf24" letter-spacing="1.5">RAD: 45PX // DEPTH</text>
  </g>
</svg>
