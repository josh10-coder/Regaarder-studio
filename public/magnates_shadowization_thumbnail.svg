<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="noir-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18040a"/>
      <stop offset="50%" stop-color="#0b0307"/>
      <stop offset="100%" stop-color="#020103"/>
    </linearGradient>

    <!-- Ominous Red Rim Glow -->
    <filter id="crimson-rim" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feFlood flood-color="#f43f5e" flood-opacity="0.9" result="glow"/>
      <feComposite in="glow" in2="blur" operator="in" result="rim"/>
      <feMerge>
        <feMergeNode in="rim"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#noir-bg)"/>

  <!-- Dramatic Gradient Colorize Halftone Beam -->
  <rect x="0" y="0" width="800" height="450" fill="radial-gradient(ellipse at center, rgba(225,29,72,0.25) 0%, transparent 75%)"/>

  <!-- Left: Original Graded Character // Right: Shadowized Flat Black Silhouette -->
  <!-- Split Screen Divider -->
  <line x1="400" y1="50" x2="400" y2="350" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Left Character: Gradient Colorized (Sepia / Crimson Noir) -->
  <g transform="translate(180, 80)">
    <rect width="180" height="240" rx="14" fill="#1c0710" stroke="#f43f5e" stroke-width="1.5"/>
    <circle cx="90" cy="85" r="40" fill="#fda4af"/>
    <path d="M35 220 C45 150, 65 140, 90 140 C115 140, 135 150, 145 220 Z" fill="#881337"/>
    <rect x="20" y="195" width="140" height="22" rx="4" fill="rgba(0,0,0,0.85)" stroke="#f43f5e" stroke-width="1"/>
    <text x="90" y="210" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">
      GRADIENT COLORIZED
    </text>
  </g>

  <!-- Right Character: Flat Ominous Black Silhouette with Red Rim Lighting -->
  <g transform="translate(440, 80)" filter="url(#crimson-rim)">
    <rect width="180" height="240" rx="14" fill="#050103" stroke="#e11d48" stroke-width="2"/>
    <!-- Pitch Black Silhouette Cutout -->
    <circle cx="90" cy="85" r="40" fill="#000000" stroke="#f43f5e" stroke-width="1.5"/>
    <path d="M35 220 C45 150, 65 140, 90 140 C115 140, 135 150, 145 220 Z" fill="#000000" stroke="#f43f5e" stroke-width="1.5"/>
    <rect x="15" y="195" width="150" height="22" rx="4" fill="rgba(244,63,94,0.18)" stroke="#f43f5e" stroke-width="1"/>
    <text x="90" y="210" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" text-anchor="middle">
      FLAT BLACK SHADOWIZATION
    </text>
  </g>

  <!-- Title Pill -->
  <g transform="translate(200, 375)">
    <rect width="400" height="50" rx="10" fill="rgba(10,2,6,0.95)" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="200" y="22" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="1.5">
      MAGNATES MEDIA // TONE &amp; ATMOSPHERE
    </text>
    <text x="200" y="40" fill="#ffffff" font-family="'Cinzel', serif" font-size="15" font-weight="900" text-anchor="middle">
      COLOR GRADING &amp; SHADOWIZATION
    </text>
  </g>
</svg>
